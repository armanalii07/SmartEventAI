<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Event Gallery | SmartEventAI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* HEADER */

        header {
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            padding: 22px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
        }

        .event-info {
            text-align: right;
            font-size: 14px;
            opacity: 0.95;
        }

        /* HERO */

        .hero {
            max-width: 1200px;
            margin: 35px auto 10px;
            padding: 0 20px;
        }

        .hero h1 {
            margin-bottom: 8px;
            font-size: 32px;
        }

        .hero p {
            color: #64748b;
            margin-top: 0;
        }

        /* STATS */

        .stats {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .stat-card span {
            display: block;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-card strong {
            font-size: 26px;
        }

        /* GALLERY */

        #gallery {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .photo-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 22px rgba(0,0,0,0.08);
            transition: 0.25s;
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .photo-details {
            padding: 14px;
        }

        .photo-name {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .similarity {
            margin-top: 7px;
            color: #16a34a;
            font-size: 13px;
            font-weight: bold;
        }

        /* DOWNLOAD */

        .download-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 12px;
            padding: 11px;
            background: #111827;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #2563eb;
        }

        /* SHARE */

        .share-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 8px;
            padding: 11px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .share-btn:hover {
            background: #1d4ed8;
        }

        /* MESSAGE */

        .message {
            max-width: 700px;
            margin: 70px auto;
            text-align: center;
            padding: 35px 20px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .message h2 {
            margin-bottom: 10px;
        }

        .message p {
            color: #64748b;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 11px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 9px;
        }

        /* FULLSCREEN */

        .viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .viewer img {
            max-width: 95%;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 35px;
            cursor: pointer;
        }

        .viewer-actions {
            position: absolute;
            bottom: 25px;
            display: flex;
            gap: 10px;
        }

        .viewer-download,
        .viewer-share {
            padding: 12px 22px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .viewer-download {
            background: white;
            color: #111827;
        }

        .viewer-share {
            background: #2563eb;
            color: white;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .event-info {
                text-align: left;
            }

            .hero h1 {
                font-size: 26px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            #gallery {
                grid-template-columns: 1fr;
            }

            .viewer-actions {
                flex-direction: column;
                width: 80%;
            }

            .viewer-download,
            .viewer-share {
                text-align: center;
                width: 100%;
            }
        }

    </style>

</head>


<body>


<header>

    <div class="brand">
        SmartEventAI
    </div>

    <div class="event-info">

        Event Code:

        <strong id="eventCode">---</strong>

    </div>

</header>


<section class="hero">

    <h1>📸 My Personal Gallery</h1>

    <p>
        AI found these photos matching your face.
    </p>

</section>


<div class="stats">

    <div class="stat-card">

        <span>Matching Photos</span>

        <strong id="matchCount">0</strong>

    </div>


    <div class="stat-card">

        <span>AI Status</span>

        <strong>✓ Matched</strong>

    </div>

</div>


<div id="gallery"></div>


<!-- FULLSCREEN VIEWER -->

<div class="viewer" id="viewer">

    <span
        class="close"
        onclick="closeViewer()"
    >
        ×
    </span>


    <img
        id="viewerImage"
        alt="Event Photo"
    >


    <div class="viewer-actions">

        <a
            id="viewerDownload"
            class="viewer-download"
            download
        >
            ⬇ Download
        </a>


        <button
            id="viewerShare"
            class="viewer-share"
            onclick="shareViewerPhoto()"
        >
            🔗 Share
        </button>

    </div>

</div>


<script>


const API_URL = "https://smarteventai-production.up.railway.app";


const params =
    new URLSearchParams(
        window.location.search
    );


const EVENT_CODE =
    params.get("event");


document.getElementById("eventCode").textContent =
    EVENT_CODE || "---";



/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(title, text) {

    document.getElementById("gallery").innerHTML = `

        <div class="message">

            <h2>${title}</h2>

            <p>${text}</p>

            <a
                href="event.html?event=${encodeURIComponent(EVENT_CODE || "")}"
                class="back-btn"
            >
                🔍 Search Again
            </a>

        </div>

    `;
}



/* =====================================================
   FULLSCREEN
===================================================== */

let currentViewerURL = "";
let currentViewerFilename = "";



function openViewer(url, filename) {

    currentViewerURL = url;

    currentViewerFilename = filename;


    document.getElementById(
        "viewerImage"
    ).src = url;


    document.getElementById(
        "viewerDownload"
    ).href = url;


    document.getElementById(
        "viewerDownload"
    ).download = filename;


    document.getElementById(
        "viewer"
    ).style.display = "flex";
}



function closeViewer() {

    document.getElementById(
        "viewer"
    ).style.display = "none";


    document.getElementById(
        "viewerImage"
    ).src = "";


    currentViewerURL = "";

    currentViewerFilename = "";
}



/* =====================================================
   SHARE PHOTO
===================================================== */

async function sharePhoto(url, filename) {

    try {

        if (navigator.share) {

            await navigator.share({

                title: "My Event Photo",

                text:
                    "My photo from SmartEventAI",

                url: url

            });

        }

        else {

            await navigator.clipboard.writeText(url);

            alert(
                "Photo link copied successfully!"
            );
        }

    }

    catch (error) {

        if (error.name !== "AbortError") {

            console.error(
                "Share error:",
                error
            );

            alert(
                "Unable to share photo."
            );
        }
    }
}



/* =====================================================
   SHARE FULLSCREEN PHOTO
===================================================== */

async function shareViewerPhoto() {

    if (!currentViewerURL) {

        return;
    }


    await sharePhoto(
        currentViewerURL,
        currentViewerFilename
    );
}



/* =====================================================
   DISPLAY RESULTS
===================================================== */

function displayResults(data) {

    const gallery =
        document.getElementById("gallery");


    document.getElementById(
        "matchCount"
    ).textContent =
        data.matches_found || 0;


    if (
        !data.matches_found ||
        data.matches_found === 0
    ) {

        showMessage(

            "😔 No Matching Photos",

            "We couldn't find photos matching your face."

        );

        return;
    }


    gallery.innerHTML = "";


    data.matches.forEach(
        (photo, index) => {

            const imageURL = photo.photo_url;


            const similarity =
                (
                    Number(photo.similarity) * 100
                ).toFixed(1);


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "photo-card";


            const safeFilename =
                photo.filename
                    .replace(/\\/g, "\\\\")
                    .replace(/'/g, "\\'");


            card.innerHTML = `

                <img
                    src="${imageURL}"
                    alt="Matching Event Photo"
                    onclick="openViewer(
                        '${imageURL}',
                        '${safeFilename}'
                    )"
                >


                <div class="photo-details">

                    <div class="photo-name">

                        ${photo.filename}

                    </div>


                    <div class="similarity">

                        AI Match: ${similarity}%

                    </div>


                    <a
                        class="download-btn"
                        href="${imageURL}"
                        download="${safeFilename}"
                    >
                        ⬇ Download Photo
                    </a>


                    <button
                        class="share-btn"
                        onclick="sharePhoto(
                            '${imageURL}',
                            '${safeFilename}'
                        )"
                    >
                        🔗 Share Photo
                    </button>

                </div>

            `;


            gallery.appendChild(card);

        }
    );

}



/* =====================================================
   LOAD RESULTS
===================================================== */

function loadResults() {

    if (!EVENT_CODE) {

        showMessage(

            "❌ Event Code Missing",

            "Please open the gallery through a valid event."

        );

        return;
    }


    const savedResults =
        sessionStorage.getItem(
            "smartEventResults"
        );


    if (!savedResults) {

        showMessage(

            "🔍 No Search Result",

            "Please upload your selfie and search again."

        );

        return;
    }


    try {

        const data =
            JSON.parse(savedResults);


        if (
            data.event_code &&
            data.event_code !== EVENT_CODE
        ) {

            showMessage(

                "⚠️ Search Mismatch",

                "This search result belongs to another event."

            );

            return;
        }


        displayResults(data);

    }


    catch (error) {

        console.error(error);


        showMessage(

            "❌ Something went wrong",

            "Unable to load your search results."

        );

    }

}



/* =====================================================
   CLOSE VIEWER WHEN CLICKING OUTSIDE IMAGE
===================================================== */

document
    .getElementById("viewer")
    .addEventListener(
        "click",
        function(e) {

            if (
                e.target === this
            ) {

                closeViewer();

            }

        }
    );



/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape"
        ) {

            closeViewer();

        }

    }
);



/* =====================================================
   START
===================================================== */

loadResults();


</script>


</body>

</html>
