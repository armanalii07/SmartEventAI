        >

        </button>

        ></div>

<script>

const API_URL =
    "https://smarteventai-production.up.railway.app";


/* GET EVENT CODE FROM URL */

const params =
    new URLSearchParams(window.location.search);

const selectedEvent =
    params.get("event");


if(selectedEvent){

    document.getElementById(
        "eventCode"
    ).value = selectedEvent;

}


/* SELFIE INPUT */

const selfieInput =
    document.getElementById("selfie");


/* SELFIE PREVIEW */

selfieInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){

            return;

        }

        const reader =
            new FileReader();


        reader.onload =
            function(e){

                document.getElementById(
                    "previewImage"
                ).src =
                    e.target.result;


                document.getElementById(
                    "preview"
                ).style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* FIND PHOTOS */

async function findPhotos(){

    const eventCode =
        document.getElementById(
            "eventCode"
        ).value.trim().toUpperCase();


    const selfie =
        selfieInput.files[0];


    const status =
        document.getElementById(
            "status"
        );


    const results =
        document.getElementById(
            "results"
        );


    const button =
        document.getElementById(
            "searchBtn"
        );


    /* CHECK EVENT CODE */

    if(!eventCode){

        alert(
            "Please enter Event Code."
        );

        return;

    }


    /* CHECK SELFIE */

    if(!selfie){

        alert(
            "Please select your selfie."
        );

        return;

    }


    /* LOADING */

    button.disabled = true;

    button.innerText =
        "🧠 AI Searching...";


    status.style.display =
        "block";


    status.innerText =
        "AI is analyzing your face and searching event photos...";


    results.innerHTML = "";


    try{

        const formData =
            new FormData();


        formData.append(
            "file",
            selfie
        );


        /* CALL RAILWAY AI API */

        const response =
            await fetch(
                `${API_URL}/events/${encodeURIComponent(eventCode)}/search`,
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        /* API ERROR */

        if(!response.ok){

            throw new Error(
                data.detail ||
                "Search failed."
            );

        }


        /* NO MATCH */

        if(
            data.matches_found === 0 ||
            !data.matches ||
            data.matches.length === 0
        ){

            status.innerText =
                "No matching photos found.";

            results.innerHTML = `
                <div class="no-result">
                    <h3>No matching photos found</h3>
                    <p>

            button.disabled = false;

            button.innerText =
                "🔍 Find My Photos";

            return;

        }


        /* SUCCESS */

        status.innerText =
            `${data.matches_found} matching photos found.`;


        /* SHOW MATCHING PHOTOS */

        results.innerHTML = `
            <h3>
                Your Matching Photos
            </h3>
        `;


        data.matches.forEach(
            function(photo){

                const imageUrl =
                    new URL(
                        photo.photo_url,
                        API_URL
                    ).href;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "match-photo";


                card.innerHTML = `

                    <img

                        alt="Matching event photo"

            "Search Error:",
            error

        status.innerText =

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartAISearch — Find My Photos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
============================================================ */
:root{
    --bg-0:#04060f;
    --bg-1:#0a1330;
    --accent:#3b82f6;
    --accent-2:#8b5cf6;
    --accent-3:#22d3ee;
    --text:#e9effc;
    --muted:#8ea2c6;
    --line:rgba(148,163,184,.16);
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{ scroll-behavior:smooth; }

body{
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    color:var(--text);
    font-family:'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
        radial-gradient(1200px 820px at 50% -12%, #17275f 0%, transparent 62%),
        linear-gradient(160deg, #04060f 0%, #0a1330 46%, #04060f 100%);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:52px 22px 70px;
    -webkit-font-smoothing:antialiased;
}

/* ============================================================
   BACKGROUND SCENERY
============================================================ */
.bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.55;
    will-change:transform;
}
.orb-a{
    width:560px;height:560px;top:-180px;left:-140px;
    background:radial-gradient(circle, #2563eb 0%, transparent 70%);
    animation:drift-a 19s ease-in-out infinite;
}
.orb-b{
    width:500px;height:500px;bottom:-200px;right:-150px;
    background:radial-gradient(circle, #7c3aed 0%, transparent 70%);
    animation:drift-b 24s ease-in-out infinite;
}
.orb-c{
    width:400px;height:400px;top:38%;left:56%;
    background:radial-gradient(circle, #06b6d4 0%, transparent 70%);
    opacity:.38;
    animation:drift-c 28s ease-in-out infinite;
}

@keyframes drift-a{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%    { transform:translate(120px,80px) scale(1.12); }
}
@keyframes drift-b{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%    { transform:translate(-140px,-70px) scale(1.08); }
}
@keyframes drift-c{
    0%,100%{ transform:translate(0,0) scale(1); opacity:.3; }
    50%    { transform:translate(-90px,60px) scale(1.15); opacity:.5; }
}

.grid-lines{
    position:absolute;
    inset:-60px;
    background-image:
        linear-gradient(rgba(148,163,184,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,.07) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 50% 28%, #000 0%, transparent 72%);
    mask-image:radial-gradient(circle at 50% 28%, #000 0%, transparent 72%);
    animation:grid-drift 34s linear infinite;
}
@keyframes grid-drift{
    to{ background-position:64px 64px, 64px 64px; }
}

#fx{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

/* ============================================================
   SHELL
============================================================ */
.shell{
    position:relative;
    z-index:2;
    width:100%;
    max-width:720px;
}

/* ============================================================
   BACK LINK
============================================================ */
.back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:28px;
    padding:9px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    letter-spacing:.03em;
    color:#a9c2e8;
    text-decoration:none;
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:.35s ease;
}
.back:hover{
    color:#fff;
    border-color:rgba(96,165,250,.5);
    background:rgba(59,130,246,.14);
    box-shadow:0 0 26px -6px rgba(59,130,246,.8);
    transform:translateX(-3px);
}
.back svg{
    width:15px;height:15px;
    transition:transform .3s ease;
}
.back:hover svg{ transform:translateX(-3px); }

/* ============================================================
   HERO
============================================================ */
.hero{
    text-align:center;
    margin-bottom:38px;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 16px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#bcd3f7;
    background:rgba(59,130,246,.1);
    border:1px solid rgba(96,165,250,.28);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 0 26px rgba(59,130,246,.22) inset;
    margin-bottom:24px;
}

.badge-dot{
    width:7px;height:7px;
    border-radius:50%;
    background:#22d3ee;
    box-shadow:0 0 10px #22d3ee, 0 0 20px #22d3ee;
    animation:pulse-dot 1.9s ease-in-out infinite;
}
@keyframes pulse-dot{
    0%,100%{ transform:scale(1);   opacity:1; }
    50%    { transform:scale(1.45); opacity:.55; }
}

.brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.brand-mark{
    position:relative;
    width:70px;
    height:70px;
    flex:0 0 auto;
}
.brand-mark .ring{
    position:absolute;
    inset:-4px;
    border-radius:24px;
    background:conic-gradient(from 0deg, #22d3ee, #3b82f6, #8b5cf6, #22d3ee);
    filter:blur(11px);
    opacity:.65;
    animation:spin 4.5s linear infinite;
}
.brand-mark .face{
    position:relative;
    width:100%;
    height:100%;
    border-radius:20px;
    display:grid;
    place-items:center;
    font-size:31px;
    overflow:hidden;
    background:linear-gradient(150deg, #16224a, #0a1330);
    border:1px solid rgba(147,197,253,.35);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        0 18px 40px -18px rgba(37,99,235,.9);
}

/* 🔁 To use your own logo image instead of the camera emoji,
   replace the <span class="face">📸</span> block in the HTML with:
   <span class="face"><img src="your-logo.png" alt="SmartAISearch" class="brand-logo"></span>
   and uncomment the rule below. */
.brand-logo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

@keyframes spin{ to{ transform:rotate(360deg); } }

.brand-name{
    font-size:clamp(30px, 5.6vw, 46px);
    font-weight:800;
    letter-spacing:-.025em;
    line-height:1.05;
    background:linear-gradient(100deg,#ffffff 0%,#a9c8ff 22%,#c4b5fd 46%,#67e8f9 68%,#ffffff 100%);
    background-size:220% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shimmer 7s linear infinite;
}
@keyframes shimmer{
    to{ background-position:220% center; }
}

.tagline{
    color:var(--muted);
    font-size:15.5px;
    font-weight:300;
    max-width:460px;
    margin:0 auto;
    line-height:1.65;
}

/* ============================================================
   PANEL
============================================================ */
.panel{
    position:relative;
    overflow:hidden;
    padding:32px 28px 30px;
    border-radius:var(--radius);
    background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    border:1px solid var(--line);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
        0 24px 60px -28px rgba(0,0,0,.95),
        inset 0 1px 0 rgba(255,255,255,.07);
    animation:rise .8s .12s cubic-bezier(.2,.8,.2,1) both;
}
.panel::before{
    content:'';
    position:absolute;
    top:0; left:12%;
    width:76%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(147,197,253,.9), transparent);
    opacity:.55;
}

@keyframes rise{
    from{ opacity:0; transform:translateY(26px) scale(.98); }
    to  { opacity:1; transform:translateY(0) scale(1); }
}

/* ============================================================
   FORM
============================================================ */
.field-label{
    display:block;
    font-size:12px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#93a8cb;
    margin-bottom:10px;
}

.input-wrap{
    position:relative;
    margin-bottom:26px;
}

.input-wrap input{
    width:100%;
    padding:15px 18px 15px 46px;
    border-radius:14px;
    border:1px solid rgba(148,163,184,.2);
    background:rgba(8,14,34,.68);
    color:#eaf1ff;
    font-family:'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size:14.5px;
    letter-spacing:.06em;
    outline:none;
    transition:.35s ease;
}
.input-wrap input::placeholder{
    color:#5f7295;
    letter-spacing:.03em;
}
.input-wrap input:focus{
    border-color:rgba(96,165,250,.65);
    background:rgba(11,19,44,.85);
    box-shadow:
        0 0 0 4px rgba(59,130,246,.14),
        0 0 32px -6px rgba(59,130,246,.75);
}
.input-wrap .input-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    font-size:16px;
    opacity:.65;
    pointer-events:none;
}

/* ============================================================
   UPLOAD ZONE
============================================================ */
.upload{
    position:relative;
    overflow:hidden;
    padding:38px 24px;
    border-radius:18px;
    border:2px dashed rgba(148,163,184,.3);
    background:rgba(8,14,34,.5);
    text-align:center;
    cursor:pointer;
    transition:.4s cubic-bezier(.2,.8,.2,1);
}
.upload:hover,
.upload.drag{
    border-color:rgba(96,165,250,.85);
    background:rgba(59,130,246,.1);
    box-shadow:
        0 0 0 4px rgba(59,130,246,.1),
        0 0 44px -8px rgba(59,130,246,.85);
    transform:translateY(-2px);
}

.upload-icon{
    width:64px;height:64px;
    margin:0 auto 16px;
    border-radius:19px;
    display:grid;
    place-items:center;
    font-size:29px;
    background:linear-gradient(150deg, rgba(59,130,246,.3), rgba(139,92,246,.18));
    border:1px solid rgba(147,197,253,.3);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        0 0 30px rgba(59,130,246,.35);
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
}
.upload:hover .upload-icon,
.upload.drag .upload-icon{
    transform:translateY(-4px) scale(1.08) rotate(-6deg);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 0 42px rgba(99,102,241,.7);
}

.upload strong{
    display:block;
    font-size:16.5px;
    font-weight:600;
    color:#eef4ff;
    margin-bottom:7px;
    letter-spacing:-.01em;
}
.upload p{
    color:#7f93b6;
    font-size:13.5px;
    font-weight:300;
    line-height:1.55;
}

#selfie{ display:none; }

/* ============================================================
   PREVIEW
============================================================ */
.preview{
    display:none;
    margin-top:22px;
    text-align:center;
    animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
}
.preview-frame{
    position:relative;
    display:inline-block;
    padding:4px;
    border-radius:22px;
    background:conic-gradient(from 0deg, #22d3ee, #3b82f6, #8b5cf6, #22d3ee);
    animation:spin 6s linear infinite;
    box-shadow:0 0 46px -10px rgba(99,102,241,.9);
}
.preview-frame img{
    display:block;
    width:156px;
    height:156px;
    object-fit:cover;
    border-radius:18px;
    animation:spin-reverse 6s linear infinite;
}
@keyframes spin-reverse{ to{ transform:rotate(-360deg); } }

.preview-name{
    margin-top:12px;
    font-size:12.5px;
    color:#8ea2c6;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    letter-spacing:.03em;
    word-break:break-all;
}

/* ============================================================
   BUTTON
============================================================ */
.btn{
    position:relative;
    overflow:hidden;
    width:100%;
    margin-top:26px;
    border:0;
    cursor:pointer;
    padding:15px 18px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:inherit;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:.015em;
    color:#fff;
    background:linear-gradient(120deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%);
    background-size:220% 100%;
    background-position:0% 0;
    box-shadow:
        0 14px 30px -14px rgba(59,130,246,.95),
        inset 0 1px 0 rgba(255,255,255,.28);
    transition:background-position .65s ease, transform .22s ease, box-shadow .35s ease, opacity .3s ease;
}
.btn:hover:not(:disabled){
    background-position:100% 0;
    transform:translateY(-2px);
    box-shadow:
        0 20px 42px -14px rgba(99,102,241,1),
        inset 0 1px 0 rgba(255,255,255,.35);
}
.btn:active:not(:disabled){
    transform:translateY(0) scale(.985);
}
.btn:focus-visible{
    outline:2px solid #67e8f9;
    outline-offset:3px;
}
.btn:disabled{
    cursor:not-allowed;
    opacity:.72;
    box-shadow:0 10px 24px -14px rgba(59,130,246,.7);
}
.btn::after{
    content:'';
    position:absolute;
    top:0; left:-160%;
    width:60%;
    height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.48), transparent);
    transform:skewX(-20deg);
    transition:left .8s ease;
}
.btn:hover:not(:disabled)::after{ left:160%; }

.btn .btn-spinner{
    width:16px;height:16px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    animation:spin .8s linear infinite;
    display:none;
}
.btn.loading .btn-spinner{ display:block; }

/* ============================================================
   STATUS
============================================================ */
.status{
    display:none;
    margin-top:20px;
    padding:14px 18px;
    border-radius:14px;
    font-size:14px;
    font-weight:400;
    line-height:1.55;
    color:#c3d6f5;
    background:rgba(59,130,246,.09);
    border:1px solid rgba(96,165,250,.26);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
}
.status.show{ display:flex; align-items:center; gap:11px; }

.status .dot{
    flex:0 0 auto;
    width:8px;height:8px;
    border-radius:50%;
    background:#22d3ee;
    box-shadow:0 0 10px #22d3ee, 0 0 20px #22d3ee;
    animation:pulse-dot 1.5s ease-in-out infinite;
}
.status.success{
    background:rgba(34,197,94,.1);
    border-color:rgba(34,197,94,.32);
    color:#bbf7d0;
}
.status.success .dot{
    background:#4ade80;
    box-shadow:0 0 10px #4ade80, 0 0 20px #4ade80;
}
.status.error{
    background:rgba(239,68,68,.1);
    border-color:rgba(239,68,68,.34);
    color:#fecaca;
}
.status.error .dot{
    background:#f87171;
    box-shadow:0 0 10px #f87171, 0 0 20px #f87171;
}

/* ============================================================
   RESULTS
============================================================ */
.results{
    margin-top:28px;
}

.results-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
}
.results-head h3{
    font-size:19px;
    font-weight:700;
    letter-spacing:-.015em;
    color:#f3f7ff;
}
.results-count{
    margin-left:auto;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#a5f3fc;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(34,211,238,.1);
    border:1px solid rgba(34,211,238,.3);
}

.match{
    position:relative;
    overflow:hidden;
    isolation:isolate;
    padding:16px;
    margin-bottom:20px;
    border-radius:20px;
    background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    border:1px solid var(--line);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
        0 18px 44px -26px rgba(0,0,0,.95),
        inset 0 1px 0 rgba(255,255,255,.07);
    transition:
        transform .45s cubic-bezier(.2,.8,.2,1),
        border-color .45s ease,
        box-shadow .45s ease;
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:calc(var(--i, 0) * 90ms);
}
.match::before{
    content:'';
    position:absolute;
    top:0; left:12%;
    width:76%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(147,197,253,.9), transparent);
    opacity:.4;
    transition:opacity .45s ease;
}
.match:hover{
    transform:translateY(-7px);
    border-color:rgba(96,165,250,.5);
    box-shadow:
        0 32px 58px -26px rgba(37,99,235,.85),
        0 0 0 1px rgba(96,165,250,.22),
        inset 0 1px 0 rgba(255,255,255,.12);
}
.match:hover::before{ opacity:1; }

.match img{
    display:block;
    width:100%;
    max-height:520px;
    object-fit:contain;
    border-radius:14px;
    background:rgba(4,8,20,.6);
    border:1px solid rgba(148,163,184,.14);
}

.match-meta{
    display:flex;
    align-items:center;
    gap:12px;
    margin:16px 4px 14px;
}

.sim-label{
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#8ea2c6;
    flex:0 0 auto;
}

.sim-bar{
    position:relative;
    flex:1;
    height:7px;
    border-radius:999px;
    overflow:hidden;
    background:rgba(8,14,34,.85);
    border:1px solid rgba(148,163,184,.16);
}
.sim-fill{
    position:absolute;
    inset:0 auto 0 0;
    width:0;
    border-radius:999px;
    background:linear-gradient(90deg, #22d3ee, #3b82f6, #8b5cf6);
    box-shadow:0 0 14px rgba(59,130,246,.9);
    transition:width 1.1s cubic-bezier(.2,.8,.2,1);
}

.sim-value{
    flex:0 0 auto;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:13.5px;
    font-weight:600;
    color:#93c5fd;
    text-shadow:0 0 16px rgba(147,197,253,.6);
    min-width:52px;
    text-align:right;
}

.match-actions{
    display:flex;
    gap:10px;
}
.match-actions a{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 14px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(120deg, #2563eb, #4f46e5);
    background-size:200% 100%;
    background-position:0 0;
    box-shadow:
        0 10px 22px -12px rgba(59,130,246,.95),
        inset 0 1px 0 rgba(255,255,255,.24);
    transition:background-position .55s ease, transform .22s ease, box-shadow .35s ease;
}
.match-actions a:hover{
    background-position:100% 0;
    transform:translateY(-2px);
    box-shadow:
        0 16px 30px -12px rgba(99,102,241,1),
        inset 0 1px 0 rgba(255,255,255,.32);
}
.match-actions a.ghost{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(148,163,184,.24);
    color:#d7e5ff;
    box-shadow:none;
}
.match-actions a.ghost:hover{
    background:rgba(59,130,246,.16);
    border-color:rgba(96,165,250,.55);
    box-shadow:0 0 26px -8px rgba(59,130,246,.9);
}
.match-actions a svg{
    width:15px;height:15px;
}

/* ============================================================
   EMPTY STATE
============================================================ */
.no-result{
    text-align:center;
    padding:46px 26px;
    border-radius:var(--radius);
    background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid var(--line);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
}
.no-result .icon{
    font-size:44px;
    display:block;
    margin-bottom:16px;
}
.no-result h3{
    font-size:19px;
    font-weight:700;
    margin-bottom:9px;
    color:#f3f7ff;
}
.no-result p{
    font-size:14px;
    color:var(--muted);
    font-weight:300;
    line-height:1.6;
}

/* ============================================================
   FOOTER
============================================================ */
.foot{
    margin-top:42px;
    text-align:center;
    font-size:12.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#5c6f92;
    font-weight:400;
    animation:rise .9s .2s cubic-bezier(.2,.8,.2,1) both;
}
.foot span{ color:#93c5fd; }

/* ============================================================
   SCROLLBAR
============================================================ */
::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background:#050914; }
::-webkit-scrollbar-thumb{
    background:linear-gradient(#3b82f6, #8b5cf6);
    border-radius:10px;
    border:2px solid #050914;
}
::-webkit-scrollbar-thumb:hover{ background:linear-gradient(#60a5fa, #a78bfa); }

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width:640px){
    body{ padding:34px 16px 54px; }
    .hero{ margin-bottom:30px; }
    .brand{ gap:14px; }
    .brand-mark{ width:58px; height:58px; }
    .brand-mark .face{ font-size:26px; border-radius:17px; }
    .brand-mark .ring{ border-radius:20px; }
    .panel{ padding:26px 20px 24px; }
    .upload{ padding:30px 18px; }
    .match-actions{ flex-direction:column; }
}

/* ============================================================
   REDUCED MOTION
============================================================ */
@media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
    }
    #fx{ display:none; }
}
</style>
</head>

<body>

<!-- ================= BACKGROUND ================= -->
<div class="bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grid-lines"></div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<!-- ================= CONTENT ================= -->
<main class="shell">

    <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 18l-6-6 6-6"/>
        </svg>
        All Events
    </a>

    <header class="hero">
        <div class="badge">
            <span class="badge-dot"></span>
            Neural Face Match · Active
        </div>

        <div class="brand">
            <div class="brand-mark">
                <span class="ring"></span>
                <!-- 🔁 Replace 📸 with your own logo:
                     <img src="your-logo.png" alt="SmartAISearch" class="brand-logo"> -->
                <span class="face">📸</span>
            </div>
            <h1 class="brand-name">SmartAISearch</h1>
        </div>

        <p class="tagline">
            Enter your event code and upload a selfie — our AI will surface every photo you appear in.
        </p>
    </header>

    <!-- ================= PANEL ================= -->
    <section class="panel">

        <label class="field-label" for="eventCode">Event Code</label>

        <div class="input-wrap">
            <span class="input-icon">🎟️</span>
            <input
                type="text"
                id="eventCode"
                placeholder="Example: ARM2026"
                autocomplete="off"
                spellcheck="false"
            >
        </div>

        <label class="field-label">Your Selfie</label>

        <div
            class="upload"
            id="uploadZone"
            role="button"
            tabindex="0"
            aria-label="Select your selfie"
        >
            <div class="upload-icon">📸</div>
            <strong>Select your selfie</strong>
            <p>Use a clear, front-facing photo where your face is fully visible.</p>

            <input
                type="file"
                id="selfie"
                accept="image/*"
            >
        </div>

        <div class="preview" id="preview">
            <div class="preview-frame">
                <img id="previewImage" alt="Selfie preview">
            </div>
            <div class="preview-name" id="previewName"></div>
        </div>

        <button class="btn" id="searchBtn" type="button">
            <span class="btn-spinner"></span>
            <span id="btnText">🔍 Find My Photos</span>
        </button>

        <div class="status" id="status">
            <span class="dot"></span>
            <span id="statusText"></span>
        </div>

        <div class="results" id="results"></div>

    </section>

    <footer class="foot">
        Powered by <span>SmartAISearch</span> · Face Recognition
    </footer>

</main>

<script>

/* ============================================================
   CONFIG
============================================================ */
const API_URL = "https://smarteventai-production.up.railway.app";
// const API_URL = "http://127.0.0.1:8000";

/* ============================================================
   ELEMENTS
============================================================ */
const selfieInput  = document.getElementById("selfie");
const uploadZone   = document.getElementById("uploadZone");
const previewBox   = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const previewName  = document.getElementById("previewName");
const eventInput   = document.getElementById("eventCode");
const searchBtn    = document.getElementById("searchBtn");
const btnText      = document.getElementById("btnText");
const statusBox    = document.getElementById("status");
const statusText   = document.getElementById("statusText");
const resultsBox   = document.getElementById("results");

/* ============================================================
   HELPERS
============================================================ */
function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function setStatus(message, type = "info"){
    statusBox.className = "status show " + (type === "info" ? "" : type);
    statusText.textContent = message;
}

function hideStatus(){
    statusBox.className = "status";
    statusText.textContent = "";
}

function setLoading(isLoading){
    searchBtn.disabled = isLoading;
    searchBtn.classList.toggle("loading", isLoading);
    btnText.textContent = isLoading ? "🧠 AI Searching…" : "🔍 Find My Photos";
}

/* ============================================================
   GET EVENT CODE FROM URL
============================================================ */
const params = new URLSearchParams(window.location.search);
const selectedEvent = params.get("event");

if (selectedEvent){
    eventInput.value = selectedEvent;
}

/* ============================================================
   SELFIE PICKER
============================================================ */
uploadZone.addEventListener("click", () => selfieInput.click());

uploadZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " "){
        e.preventDefault();
        selfieInput.click();
    }
});

/* drag & drop */
["dragenter", "dragover"].forEach(evt => {
    uploadZone.addEventListener(evt, (e) => {
        e.preventDefault();
        uploadZone.classList.add("drag");
    });
});

["dragleave", "drop"].forEach(evt => {
    uploadZone.addEventListener(evt, (e) => {
        e.preventDefault();
        uploadZone.classList.remove("drag");
    });
});

uploadZone.addEventListener("drop", (e) => {
    const file = e.dataTransfer?.files?.[0];
    if (!file) return;
    selfieInput.files = e.dataTransfer.files;
    showPreview(file);
});

/* ============================================================
   SELFIE PREVIEW
============================================================ */
function showPreview(file){
    if (!file || !file.type.startsWith("image/")) return;

    const reader = new FileReader();

    reader.onload = (e) => {
        previewImage.src = e.target.result;
        previewName.textContent = file.name;
        previewBox.style.display = "block";
    };

    reader.readAsDataURL(file);
}

selfieInput.addEventListener("change", function(){
    showPreview(this.files[0]);
});

/* ============================================================
   FIND PHOTOS
============================================================ */
async function findPhotos(){
    const eventCode = eventInput.value.trim().toUpperCase();
    const selfie    = selfieInput.files[0];

    /* ---- validation ---- */
    if (!eventCode){
        setStatus("Please enter your event code.", "error");
        eventInput.focus();
        return;
    }

    if (!selfie){
        setStatus("Please select a selfie to search with.", "error");
        uploadZone.scrollIntoView({ behavior:"smooth", block:"center" });
        return;
    }

    /* ---- loading ---- */
    setLoading(true);
    setStatus("AI is analyzing your face and scanning event photos…", "info");
    resultsBox.innerHTML = "";

    try{
        const formData = new FormData();
        formData.append("file", selfie);

        const response = await fetch(
            `${API_URL}/events/${encodeURIComponent(eventCode)}/search`,
            {
                method: "POST",
                body: formData
            }
        );

        let data = {};
        try{
            data = await response.json();
        }catch(_){
            data = {};
        }

        if (!response.ok){
            throw new Error(data.detail || "Search failed. Please try again.");
        }

        /* ---- no matches ---- */
        if (
            data.matches_found === 0 ||
            !Array.isArray(data.matches) ||
            data.matches.length === 0
        ){
            setStatus("No matching photos found for this event.", "error");

            resultsBox.innerHTML = `
                <div class="no-result">
                    <span class="icon">🔍</span>
                    <h3>No matching photos found</h3>
                    <p>
                        Try uploading a clear, front-facing selfie with good lighting.
                    </p>
                </div>
            `;

            setLoading(false);
            return;
        }

        /* ---- success ---- */
        const count = data.matches_found ?? data.matches.length;

        setStatus(`${count} matching photo${count > 1 ? "s" : ""} found.`, "success");

        resultsBox.innerHTML = `
            <div class="results-head">
                <h3>Your Matching Photos</h3>
                <span class="results-count">${count} Match${count > 1 ? "es" : ""}</span>
            </div>
        `;

        data.matches.forEach((photo, index) => {
            let imageUrl;
            try{
                imageUrl = new URL(photo.photo_url, API_URL).href;
            }catch(_){
                imageUrl = photo.photo_url;
            }

            const similarity = Number(photo.similarity) || 0;
            const percent = Math.max(0, Math.min(100, similarity * 100)).toFixed(1);

            const card = document.createElement("div");
            card.className = "match";
            card.style.setProperty("--i", index);

            card.innerHTML = `
                <img
                    src="${escapeHtml(imageUrl)}"
                    alt="Matching event photo"
                    loading="lazy"
                >

                <div class="match-meta">
                    <span class="sim-label">Face Match</span>
                    <span class="sim-bar">
                        <span class="sim-fill" data-w="${percent}"></span>
                    </span>
                    <span class="sim-value">${percent}%</span>
                </div>

                <div class="match-actions">
                    <a href="${escapeHtml(imageUrl)}" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        View
                    </a>

                    <a class="ghost" href="${escapeHtml(imageUrl)}" download>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <path d="M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                        Download
                    </a>
                </div>
            `;

            resultsBox.appendChild(card);

            /* animate similarity bar after paint */
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const fill = card.querySelector(".sim-fill");
                    if (fill) fill.style.width = fill.dataset.w + "%";
                }, 120 + index * 90);
            });
        });

        setLoading(false);

        /* scroll results into view */
        resultsBox.scrollIntoView({ behavior:"smooth", block:"start" });

    }catch(error){
        console.error("Search Error:", error);

        setStatus(
            error.message && error.message !== "Failed to fetch"
                ? error.message
                : "Unable to reach the server. Please check your connection.",
            "error"
        );

        setLoading(false);
    }
}

/* ============================================================
   BINDINGS
============================================================ */
searchBtn.addEventListener("click", findPhotos);

eventInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") findPhotos();
});

/* ============================================================
   PARTICLE FIELD
============================================================ */
(function initParticles(){
    const canvas = document.getElementById("fx");
    if (!canvas) return;

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) return;

    const ctx = canvas.getContext("2d");
    if (!ctx) return;

    let dpr = 1;
    let w = 0;
    let h = 0;
    let particles = [];
    let rafId = null;

    function resize(){
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        w = canvas.width  = Math.floor(window.innerWidth  * dpr);
        h = canvas.height = Math.floor(window.innerHeight * dpr);

        canvas.style.width  = window.innerWidth  + "px";
        canvas.style.height = window.innerHeight + "px";

        build();
    }

    function build(){
        const count = Math.min(70, Math.max(24, Math.floor(window.innerWidth / 24)));

        particles = Array.from({ length: count }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: (Math.random() * 1.5 + 0.5) * dpr,
            vx: (Math.random() - 0.5) * 0.22 * dpr,
            vy: (Math.random() - 0.5) * 0.22 * dpr,
            a: Math.random() * 0.45 + 0.15,
            hue: Math.random() > 0.55 ? 200 : 265
        }));
    }

    function frame(){
        ctx.clearRect(0, 0, w, h);

        for (const p of particles){
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < -20) p.x = w + 20;
            if (p.x > w + 20) p.x = -20;
            if (p.y < -20) p.y = h + 20;
            if (p.y > h + 20) p.y = -20;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 92%, 74%, ${p.a})`;
            ctx.shadowBlur = 12 * dpr;
            ctx.shadowColor = `hsla(${p.hue}, 92%, 68%, .85)`;
            ctx.fill();
        }

        ctx.shadowBlur = 0;
        rafId = requestAnimationFrame(frame);
    }

    function start(){
        if (rafId === null) frame();
    }

    function stop(){
        if (rafId !== null){
            cancelAnimationFrame(rafId);
            rafId = null;
        }
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 160);
    });

    document.addEventListener("visibilitychange", () => {
        document.hidden ? stop() : start();
    });

    resize();
    start();
})();

</script>
