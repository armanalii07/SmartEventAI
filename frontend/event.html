<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartEventAI - Find My Photos</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f5f7fb;
    color:#172033;
}

.container{
    max-width:650px;
    margin:auto;
    padding:50px 25px;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:40px;
}

.logo span{
    color:#6c63ff;
}

.card{
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.07);
    border:1px solid #e7e9ef;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#7b8497;
    margin-bottom:30px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input[type="text"]{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:22px;
    font-size:15px;
}

.upload{
    border:2px dashed #c5c8d5;
    border-radius:15px;
    padding:35px;
    text-align:center;
    cursor:pointer;
    background:#fafbff;
}

.upload:hover{
    border-color:#6c63ff;
}

.upload-icon{
    font-size:42px;
    margin-bottom:10px;
}

.upload p{
    color:#7b8497;
    font-size:14px;
}

#selfie{
    display:none;
}

.preview{
    display:none;
    margin-top:20px;
    text-align:center;
}

.preview img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:15px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#6c63ff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#574fe8;
}

button:disabled{
    background:#aaa;
}

.status{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    display:none;
    background:#f1f5f9;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        Smart<span>EventAI</span>
    </div>

    <div class="card">

        <h1>Find My Photos</h1>

        <p class="subtitle">
            Enter your event code and upload a selfie.
            AI will find your photos automatically.
        </p>


        <label>
            Event Code
        </label>

        <input
            type="text"
            id="eventCode"
            placeholder="Example: TEST20262">


        <label>
            Your Selfie
        </label>

        <div
            class="upload"
            onclick="document.getElementById('selfie').click()">

            <div class="upload-icon">
                📸
            </div>

            <strong>
                Select your selfie
            </strong>

            <p>
                Use a clear photo where your face is visible.
            </p>

            <input
                type="file"
                id="selfie"
                accept="image/*">

        </div>


        <div
            class="preview"
            id="preview">

            <img id="previewImage">

        </div>


        <button
            id="searchBtn"
            onclick="findPhotos()">

            🔍 Find My Photos

        </button>


        <div
            class="status"
            id="status">

        </div>

    </div>

</div>


<script>

    const params = new URLSearchParams(window.location.search);
const selectedEvent = params.get("event");

if (selectedEvent) {
    document.getElementById("eventCode").value = selectedEvent;
}

const API_URL = "https://smarteventai-production.up.railway.app";


const selfieInput =
    document.getElementById("selfie");


/* SELFIE PREVIEW */

selfieInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                document.getElementById(
                    "previewImage"
                ).src = e.target.result;

                document.getElementById(
                    "preview"
                ).style.display = "block";

            };

        reader.readAsDataURL(file);

    }
);


/* FIND PHOTOS */

async function findPhotos(){

    const eventCode =
        document.getElementById(
            "eventCode"
        ).value.trim();

    const selfie =
        selfieInput.files[0];

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("searchBtn");


    if(!eventCode){

        alert(
            "Please enter Event Code."
        );

        return;
    }


    if(!selfie){

        alert(
            "Please select your selfie."
        );

        return;
    }


    button.disabled = true;

    button.innerText =
        "🧠 AI Searching...";


    status.style.display =
        "block";

    status.innerText =
        "AI is analyzing your face and searching event photos...";


    try{

        const formData =
            new FormData();

        formData.append(
            "file",
            selfie
        );


        const response =
            await fetch(
                `${API_URL}/events/${encodeURIComponent(eventCode)}/search`,
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.detail ||
                "Search failed."
            );

        }


        if(data.matches_found === 0){

            status.innerText =
                "No matching photos found.";

            button.disabled = false;

            button.innerText =
                "🔍 Find My Photos";

            return;
        }


        /*
        Store results temporarily
        and open personal gallery.
        */

        sessionStorage.setItem(
            "smartEventResults",
            JSON.stringify(data)
        );


        window.location.href =
    "gallery.html?event=" +
    encodeURIComponent(eventCode);


    }
    catch(error){

        status.innerText =
            "❌ " + error.message;

        button.disabled = false;

        button.innerText =
            "🔍 Find My Photos";

    }

}

</script>

</body>
</html>
