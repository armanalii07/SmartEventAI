const API_URL = "https://smarteventai-production.up.railway.app";


async function loadEvents() {

    const container = document.getElementById("events");

    try {

        const response = await fetch(
            `${API_URL}/events`
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail || "Unable to load events"
            );
        }

        const events = data.events || [];

        container.innerHTML = `

                Unable to load events.
                Please try again.
            </div>
        `;

}

    const code = decodeURIComponent(eventCode);

    window.location.href =
        `event.html?event=${encodeURIComponent(code)}`;
}

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAISearch — Find Your Photos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
============================================================ */
:root{
    --bg-0:#04060f;
    --bg-1:#0a1330;
    --accent:#3b82f6;
    --accent-2:#8b5cf6;
    --accent-3:#22d3ee;
    --text:#e9effc;
    --muted:#8ea2c6;
    --line:rgba(148,163,184,.16);
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{ scroll-behavior:smooth; }

body{
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    color:var(--text);
    font-family:'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
        radial-gradient(1200px 820px at 50% -12%, #17275f 0%, transparent 62%),
        linear-gradient(160deg, #04060f 0%, #0a1330 46%, #04060f 100%);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:56px 22px 70px;
    -webkit-font-smoothing:antialiased;
}

/* ============================================================
   BACKGROUND SCENERY
============================================================ */
.bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.55;
    will-change:transform;
}
.orb-a{
    width:560px;height:560px;top:-180px;left:-140px;
    background:radial-gradient(circle, #2563eb 0%, transparent 70%);
    animation:drift-a 19s ease-in-out infinite;
}
.orb-b{
    width:500px;height:500px;bottom:-200px;right:-150px;
    background:radial-gradient(circle, #7c3aed 0%, transparent 70%);
    animation:drift-b 24s ease-in-out infinite;
}
.orb-c{
    width:400px;height:400px;top:38%;left:56%;
    background:radial-gradient(circle, #06b6d4 0%, transparent 70%);
    opacity:.38;
    animation:drift-c 28s ease-in-out infinite;
}

@keyframes drift-a{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%    { transform:translate(120px,80px) scale(1.12); }
}
@keyframes drift-b{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%    { transform:translate(-140px,-70px) scale(1.08); }
}
@keyframes drift-c{
    0%,100%{ transform:translate(0,0) scale(1); opacity:.3; }
    50%    { transform:translate(-90px,60px) scale(1.15); opacity:.5; }
}

.grid-lines{
    position:absolute;
    inset:-60px;
    background-image:
        linear-gradient(rgba(148,163,184,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,.07) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 50% 28%, #000 0%, transparent 72%);
    mask-image:radial-gradient(circle at 50% 28%, #000 0%, transparent 72%);
    animation:grid-drift 34s linear infinite;
}
@keyframes grid-drift{
    to{ background-position:64px 64px, 64px 64px; }
}

#fx{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

/* ============================================================
   SHELL
============================================================ */
.shell{
    position:relative;
    z-index:2;
    width:100%;
    max-width:1000px;
}

/* ============================================================
   HERO
============================================================ */
.hero{
    text-align:center;
    margin-bottom:52px;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 16px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#bcd3f7;
    background:rgba(59,130,246,.1);
    border:1px solid rgba(96,165,250,.28);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 0 26px rgba(59,130,246,.22) inset;
    margin-bottom:26px;
}

.badge-dot{
    width:7px;height:7px;
    border-radius:50%;
    background:#22d3ee;
    box-shadow:0 0 10px #22d3ee, 0 0 20px #22d3ee;
    animation:pulse-dot 1.9s ease-in-out infinite;
}
@keyframes pulse-dot{
    0%,100%{ transform:scale(1);   opacity:1; }
    50%    { transform:scale(1.45); opacity:.55; }
}

.brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.brand-mark{
    position:relative;
    width:82px;
    height:82px;
    flex:0 0 auto;
}
.brand-mark .ring{
    position:absolute;
    inset:-4px;
    border-radius:28px;
    background:conic-gradient(from 0deg, #22d3ee, #3b82f6, #8b5cf6, #22d3ee);
    filter:blur(11px);
    opacity:.65;
    animation:spin 4.5s linear infinite;
}
.brand-mark .face{
    position:relative;
    width:100%;
    height:100%;
    border-radius:24px;
    display:grid;
    place-items:center;
    font-size:36px;
    background:linear-gradient(150deg, #16224a, #0a1330);
    border:1px solid rgba(147,197,253,.35);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        0 18px 40px -18px rgba(37,99,235,.9);
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.brand-name{
    font-size:clamp(34px, 6.4vw, 58px);
    font-weight:800;
    letter-spacing:-.025em;
    line-height:1.05;
    background:linear-gradient(100deg,#ffffff 0%,#a9c8ff 22%,#c4b5fd 46%,#67e8f9 68%,#ffffff 100%);
    background-size:220% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shimmer 7s linear infinite;
}
@keyframes shimmer{
    to{ background-position:220% center; }
}

.tagline{
    color:var(--muted);
    font-size:clamp(15px, 2.3vw, 17.5px);
    font-weight:300;
    max-width:520px;
    margin:0 auto;
    line-height:1.65;
}

/* ============================================================
   GRID
============================================================ */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(268px, 1fr));
    gap:22px;
}

/* ============================================================
   CARD
============================================================ */
.card{
    position:relative;
    overflow:hidden;
    isolation:isolate;
    padding:26px 24px 24px;
    border-radius:var(--radius);
    background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    border:1px solid var(--line);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
        0 18px 40px -22px rgba(0,0,0,.95),
        inset 0 1px 0 rgba(255,255,255,.07);
    transition:
        transform .45s cubic-bezier(.2,.8,.2,1),
        border-color .45s ease,
        box-shadow .45s ease;
    animation:rise .65s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:calc(var(--i, 0) * 85ms);
}

@keyframes rise{
    from{ opacity:0; transform:translateY(26px) scale(.97); }
    to  { opacity:1; transform:translateY(0) scale(1); }
}

/* cursor spotlight */
.spot{
    position:absolute;
    inset:0;
    z-index:-1;
    opacity:0;
    transition:opacity .4s ease;
    background:radial-gradient(
        440px circle at var(--mx,50%) var(--my,0%),
        rgba(96,165,250,.22),
        rgba(139,92,246,.12) 35%,
        transparent 62%
    );
    pointer-events:none;
}

/* animated top edge light */
.card::before{
    content:'';
    position:absolute;
    top:0; left:12%;
    width:76%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(147,197,253,.9), transparent);
    opacity:.35;
    transition:opacity .45s ease;
}

.card:hover{
    transform:translateY(-9px);
    border-color:rgba(96,165,250,.5);
    box-shadow:
        0 34px 60px -26px rgba(37,99,235,.85),
        0 0 0 1px rgba(96,165,250,.22),
        inset 0 1px 0 rgba(255,255,255,.12);
}
.card:hover .spot{ opacity:1; }
.card:hover::before{ opacity:1; }

.card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.card-icon{
    width:58px;height:58px;
    border-radius:17px;
    display:grid;
    place-items:center;
    font-size:27px;
    background:linear-gradient(150deg, rgba(59,130,246,.3), rgba(139,92,246,.18));
    border:1px solid rgba(147,197,253,.3);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        0 0 26px rgba(59,130,246,.28);
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
}
.card:hover .card-icon{
    transform:translateY(-3px) scale(1.07) rotate(-5deg);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 0 38px rgba(99,102,241,.6);
}

.chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:#a5f3fc;
    padding:6px 11px;
    border-radius:999px;
    background:rgba(34,211,238,.09);
    border:1px solid rgba(34,211,238,.28);
}
.chip i{
    width:5px;height:5px;
    border-radius:50%;
    background:#22d3ee;
    box-shadow:0 0 8px #22d3ee;
    animation:pulse-dot 1.7s ease-in-out infinite;
}

.card-title{
    font-size:22px;
    font-weight:700;
    letter-spacing:-.015em;
    line-height:1.28;
    margin-bottom:14px;
    color:#f3f7ff;
    word-break:break-word;
}

.code-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:11px 14px;
    margin-bottom:20px;
    border-radius:13px;
    background:rgba(8,14,34,.62);
    border:1px solid rgba(148,163,184,.14);
}
.code-label{
    font-size:11px;
    letter-spacing:.11em;
    text-transform:uppercase;
    color:#7f93b6;
    font-weight:500;
}
.code-value{
    font-family:'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size:13.5px;
    font-weight:600;
    color:#93c5fd;
    letter-spacing:.05em;
    text-shadow:0 0 16px rgba(147,197,253,.6);
    word-break:break-all;
    text-align:right;
}

/* ============================================================
   BUTTON
============================================================ */
.btn{
    position:relative;
    overflow:hidden;
    width:100%;
    border:0;
    cursor:pointer;
    padding:14px 18px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:.015em;
    color:#fff;
    background:linear-gradient(120deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%);
    background-size:220% 100%;
    background-position:0% 0;
    box-shadow:
        0 12px 26px -12px rgba(59,130,246,.95),
        inset 0 1px 0 rgba(255,255,255,.28);
    transition:background-position .65s ease, transform .22s ease, box-shadow .35s ease;
}
.btn:hover{
    background-position:100% 0;
    transform:translateY(-2px);
    box-shadow:
        0 18px 38px -12px rgba(99,102,241,1),
        inset 0 1px 0 rgba(255,255,255,.35);
}
.btn:active{
    transform:translateY(0) scale(.985);
}
.btn:focus-visible{
    outline:2px solid #67e8f9;
    outline-offset:3px;
}
.btn::after{
    content:'';
    position:absolute;
    top:0; left:-160%;
    width:60%;
    height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.48), transparent);
    transform:skewX(-20deg);
    transition:left .8s ease;
}
.btn:hover::after{ left:160%; }

.btn svg{
    width:17px;height:17px;
    transition:transform .3s ease;
}
.btn:hover svg{ transform:translateX(4px); }

/* ============================================================
   SKELETON
============================================================ */
.skeleton{
    pointer-events:none;
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:calc(var(--i, 0) * 70ms);
}
.sk-icon,
.sk-line,
.sk-btn{
    border-radius:12px;
    background:linear-gradient(
        90deg,
        rgba(255,255,255,.045) 25%,
        rgba(255,255,255,.14) 37%,
        rgba(255,255,255,.045) 63%
    );
    background-size:400% 100%;
    animation:sk-shimmer 1.5s ease-in-out infinite;
}
.sk-icon{ width:58px;height:58px;border-radius:17px;margin-bottom:22px; }
.sk-line{ height:14px;margin-bottom:12px; }
.sk-line.w70{ width:72%; }
.sk-line.w45{ width:46%; }
.sk-btn{ height:47px;border-radius:14px;margin-top:22px; }

@keyframes sk-shimmer{
    0%  { background-position:100% 0; }
    100%{ background-position:-100% 0; }
}

.loading-note{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:11px;
    color:var(--muted);
    font-size:14.5px;
    font-weight:300;
    letter-spacing:.04em;
    padding:8px 0 4px;
}
.loading-note .spin{
    width:15px;height:15px;
    border-radius:50%;
    border:2px solid rgba(147,197,253,.25);
    border-top-color:#67e8f9;
    animation:spin .85s linear infinite;
}

/* ============================================================
   STATES
============================================================ */
.state{
    grid-column:1 / -1;
    text-align:center;
    padding:52px 26px;
    border-radius:var(--radius);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
}
.state-icon{ font-size:44px; margin-bottom:16px; display:block; }
.state-title{ font-size:20px; font-weight:700; margin-bottom:8px; }
.state-text{ font-size:14.5px; color:var(--muted); font-weight:300; line-height:1.6; }

.state.error{
    background:rgba(239,68,68,.09);
    border:1px solid rgba(239,68,68,.32);
    box-shadow:0 0 50px -18px rgba(239,68,68,.55);
}
.state.error .state-title{ color:#fecaca; }

.state.empty{
    background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid var(--line);
}

.retry{
    margin-top:22px;
    padding:12px 26px;
    border-radius:12px;
    border:1px solid rgba(147,197,253,.35);
    background:rgba(59,130,246,.16);
    color:#dbeafe;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.3s ease;
}
.retry:hover{
    background:rgba(59,130,246,.3);
    border-color:rgba(147,197,253,.6);
    box-shadow:0 0 26px -6px rgba(59,130,246,.9);
    transform:translateY(-2px);
}

/* ============================================================
   FOOTER
============================================================ */
.foot{
    margin-top:52px;
    text-align:center;
    font-size:12.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#5c6f92;
    font-weight:400;
}
.foot span{ color:#93c5fd; }

/* ============================================================
   SCROLLBAR
============================================================ */
::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background:#050914; }
::-webkit-scrollbar-thumb{
    background:linear-gradient(#3b82f6, #8b5cf6);
    border-radius:10px;
    border:2px solid #050914;
}
::-webkit-scrollbar-thumb:hover{ background:linear-gradient(#60a5fa, #a78bfa); }

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width:640px){
    body{ padding:38px 16px 54px; }
    .hero{ margin-bottom:38px; }
    .brand{ gap:15px; }
    .brand-mark{ width:64px; height:64px; }
    .brand-mark .face{ font-size:28px; border-radius:19px; }
    .brand-mark .ring{ border-radius:22px; }
    .card{ padding:22px 20px 20px; }
    .grid{ gap:16px; }
}

/* ============================================================
   REDUCED MOTION
============================================================ */
@media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
    }
    #fx{ display:none; }
}
</style>
</head>

<body>

<!-- ================= BACKGROUND ================= -->
<div class="bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grid-lines"></div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<!-- ================= CONTENT ================= -->
<main class="shell">

    <header class="hero">
        <div class="badge">
            <span class="badge-dot"></span>
            AI Vision Engine · Online
        </div>

        <div class="brand">
            <div class="brand-mark">
                <span class="ring"></span>
                <span class="face">📸</span>
            </div>
            <h1 class="brand-name">SmartAISearch</h1>
        </div>

        <p class="tagline">
            Select your event and let our AI find every photo you're in — instantly.
        </p>
    </header>

    <section id="events" class="grid" aria-live="polite" aria-busy="true"></section>

    <footer class="foot">
        Powered by <span>SmartAISearch</span> · Face Recognition
    </footer>

</main>

<script>
/* ============================================================
   CONFIG
============================================================ */
const API_URL = "https://smarteventai-production.up.railway.app";
// const API_URL = "http://127.0.0.1:8000";

const eventsEl = document.getElementById("events");

/* ============================================================
   HELPERS
============================================================ */
function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* ============================================================
   SKELETON LOADER
============================================================ */
function showSkeletons(count = 3){
    eventsEl.setAttribute("aria-busy", "true");

    let markup = "";

    for (let i = 0; i < count; i++){
        markup += `
            <article class="card skeleton" style="--i:${i}">
                <div class="sk-icon"></div>
                <div class="sk-line w70"></div>
                <div class="sk-line w45"></div>
                <div class="sk-btn"></div>
            </article>
        `;
    }

    markup += `
        <div class="loading-note">
            <span class="spin"></span>
            Syncing with the AI engine…
        </div>
    `;

    eventsEl.innerHTML = markup;
}

/* ============================================================
   CARD TEMPLATE
============================================================ */
function buildCard(event, index){
    const name = escapeHtml(event.event_name);
    const code = String(event.event_code ?? "");

    return `
        <article class="card" style="--i:${index}">
            <div class="spot"></div>

            <div class="card-top">
                <div class="card-icon">📸</div>
                <span class="chip"><i></i>AI Ready</span>
            </div>

            <h3 class="card-title">${name}</h3>

            <div class="code-row">
                <span class="code-label">Event Code</span>
                <span class="code-value">${escapeHtml(code)}</span>
            </div>

            <button class="btn" type="button" data-code="${escapeHtml(code)}">
                <span>Find My Photos</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
            </button>
        </article>
    `;
}

/* ============================================================
   STATE TEMPLATES
============================================================ */
function showError(message){
    eventsEl.setAttribute("aria-busy", "false");
    eventsEl.innerHTML = `
        <div class="state error">
            <span class="state-icon">⚠️</span>
            <div class="state-title">Connection Interrupted</div>
            <div class="state-text">${escapeHtml(message)}</div>
            <button class="retry" type="button" data-action="retry">
                Try Again
            </button>
        </div>
    `;
}

function showEmpty(){
    eventsEl.setAttribute("aria-busy", "false");
    eventsEl.innerHTML = `
        <div class="state empty">
            <span class="state-icon">🗂️</span>
            <div class="state-title">No Events Available</div>
            <div class="state-text">
                There are no active events right now. Please check back later.
            </div>
        </div>
    `;
}

/* ============================================================
   LOAD EVENTS
============================================================ */
async function loadEvents(){
    showSkeletons();

    try{
        const response = await fetch(`${API_URL}/events`, {
            headers: { "Accept": "application/json" }
        });

        let data = {};
        try{
            data = await response.json();
        }catch(_){
            data = {};
        }

        if (!response.ok){
            throw new Error(data.detail || "Unable to load events.");
        }

        const events = Array.isArray(data.events) ? data.events : [];

        if (events.length === 0){
            showEmpty();
            return;
        }

        eventsEl.setAttribute("aria-busy", "false");
        eventsEl.innerHTML = events.map(buildCard).join("");

    }catch(error){
        console.error(error);
        showError(
            error.message && error.message !== "Failed to fetch"
                ? error.message
                : "Unable to reach the server. Please try again."
        );
    }
}

/* ============================================================
   NAVIGATION
============================================================ */
function selectEvent(eventCode){
    window.location.href =
        `event.html?event=${encodeURIComponent(eventCode)}`;
}

/* ============================================================
   EVENT DELEGATION
============================================================ */
eventsEl.addEventListener("click", (e) => {
    const retry = e.target.closest('[data-action="retry"]');
    if (retry){
        loadEvents();
        return;
    }

    const btn = e.target.closest(".btn[data-code]");
    if (!btn) return;

    selectEvent(btn.dataset.code);
});

/* ============================================================
   CURSOR SPOTLIGHT
============================================================ */
eventsEl.addEventListener("pointermove", (e) => {
    const card = e.target.closest(".card");
    if (!card || card.classList.contains("skeleton")) return;

    const rect = card.getBoundingClientRect();

    card.style.setProperty("--mx", `${((e.clientX - rect.left) / rect.width) * 100}%`);
    card.style.setProperty("--my", `${((e.clientY - rect.top) / rect.height) * 100}%`);
});

/* ============================================================
   PARTICLE FIELD
============================================================ */
(function initParticles(){
    const canvas = document.getElementById("fx");
    if (!canvas) return;

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) return;

    const ctx = canvas.getContext("2d");
    if (!ctx) return;

    let dpr = 1;
    let w = 0;
    let h = 0;
    let particles = [];
    let rafId = null;

    function resize(){
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        w = canvas.width  = Math.floor(window.innerWidth  * dpr);
        h = canvas.height = Math.floor(window.innerHeight * dpr);

        canvas.style.width  = window.innerWidth  + "px";
        canvas.style.height = window.innerHeight + "px";

        build();
    }

    function build(){
        const count = Math.min(70, Math.max(24, Math.floor(window.innerWidth / 24)));

        particles = Array.from({ length: count }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: (Math.random() * 1.5 + 0.5) * dpr,
            vx: (Math.random() - 0.5) * 0.22 * dpr,
            vy: (Math.random() - 0.5) * 0.22 * dpr,
            a: Math.random() * 0.45 + 0.15,
            hue: Math.random() > 0.55 ? 200 : 265
        }));
    }

    function frame(){
        ctx.clearRect(0, 0, w, h);

        for (const p of particles){
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < -20) p.x = w + 20;
            if (p.x > w + 20) p.x = -20;
            if (p.y < -20) p.y = h + 20;
            if (p.y > h + 20) p.y = -20;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 92%, 74%, ${p.a})`;
            ctx.shadowBlur = 12 * dpr;
            ctx.shadowColor = `hsla(${p.hue}, 92%, 68%, .85)`;
            ctx.fill();
        }

        ctx.shadowBlur = 0;
        rafId = requestAnimationFrame(frame);
    }

    function start(){
        if (rafId === null) frame();
    }

    function stop(){
        if (rafId !== null){
            cancelAnimationFrame(rafId);
            rafId = null;
        }
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 160);
    });

    document.addEventListener("visibilitychange", () => {
        document.hidden ? stop() : start();
    });

    resize();
    start();
})();

/* ============================================================
   BOOT
============================================================ */
loadEvents();
</script>

</body>
</html>
